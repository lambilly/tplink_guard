# 示例：陌生终端上线时通知，恢复后清除
# 把这段追加到 HA 的 automations.yaml，或复制到自动化编辑器中。
#
# 两个 binary_sensor 已移除，改用合并后的 online count 实体做数值触发。

- alias: 主路由发现陌生终端
  description: 在线终端不在白名单时推送通知
  mode: single
  trigger:
    - platform: template
      value_template: >-
        {{ state_attr('sensor.tplink_guard_online_all_count', 'unknown_online_count') | int(0) > 0 }}
  action:
    - service: persistent_notification.create
      data:
        notification_id: tplink_guard_unknown
        title: 主路由发现陌生终端
        message: >-
          陌生终端 IP：{{ state_attr('sensor.tplink_guard_online_all_count', 'unknown_ip_list') }}

- alias: 主路由陌生终端已离线
  description: 陌生终端全部离线后清除通知
  mode: single
  trigger:
    - platform: template
      value_template: >-
        {{ state_attr('sensor.tplink_guard_online_all_count', 'unknown_online_count') | int(0) == 0 }}
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: tplink_guard_unknown

- alias: 客人手机终端上线提醒
  description: 客人手机名单中的终端上线时推送通知
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.tplink_guard_guest_visit_count
      above: 0
  action:
    - service: persistent_notification.create
      data:
        notification_id: tplink_guard_guest_phone_online
        title: 客人手机终端已上线
        message: >-
          在家客人：{{ state_attr('sensor.tplink_guard_guest_visit_count', 'guest_home_list') }}
